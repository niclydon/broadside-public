<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Broadside favicon — stacked content queue + broadcast signal -->
  <!-- Cerulean (#5aadf0) on transparent, matching App UI branding -->

  <!-- Back page (slightly offset — represents the queue) -->
  <rect x="8" y="5" width="18" height="22" rx="2" fill="#3a8fd4" opacity="0.5" />

  <!-- Front page -->
  <rect x="5" y="7" width="18" height="22" rx="2" fill="#5aadf0" />

  <!-- Text lines on front page -->
  <rect x="9" y="12" width="10" height="1.5" rx="0.75" fill="#0d0d0f" opacity="0.5" />
  <rect x="9" y="16" width="8" height="1.5" rx="0.75" fill="#0d0d0f" opacity="0.4" />
  <rect x="9" y="20" width="11" height="1.5" rx="0.75" fill="#0d0d0f" opacity="0.4" />
  <rect x="9" y="24" width="6" height="1.5" rx="0.75" fill="#0d0d0f" opacity="0.3" />

  <!-- Broadcast signal arcs (top-right corner) -->
  <path d="M24 8 A4 4 0 0 1 28 4" stroke="#7ac0f5" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M24 5 A7 7 0 0 1 31 -2" stroke="#5aadf0" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>
